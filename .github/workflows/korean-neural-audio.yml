name: Korean Neural Audio (MeloTTS)

on:
  workflow_dispatch:
    inputs:
      start:
        description: First vocabulary number (1-1500)
        required: true
        default: '1'
      end:
        description: Last vocabulary number (1-1500)
        required: true
        default: '20'
      listening_start:
        description: First listening item index, zero-based
        required: true
        default: '0'
      listening_end:
        description: Exclusive listening item index
        required: true
        default: '10'
      auto_expand:
        description: Continue in resumable batches until full audio corpus is ready
        required: true
        default: 'false'
  push:
    paths:
      - '.github/workflows/korean-neural-audio.yml'
      - 'scripts/export-korean-audio.cjs'

permissions:
  contents: write
  actions: write
  pages: write

concurrency:
  group: korean-neural-audio
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install audio encoder
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          ffmpeg -version | head -n 1
      - name: Install Korean TTS
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/myshell-ai/MeloTTS.git"
          pip install "python-mecab-ko>=1.3.0"
          python -m unidic download
      - name: Export study texts
        env:
          START: ${{ github.event.inputs.start || '1' }}
          END: ${{ github.event_name == 'push' && '1500' || github.event.inputs.end || '20' }}
          LISTENING_START: ${{ github.event.inputs.listening_start || '0' }}
          LISTENING_END: ${{ github.event_name == 'push' && '230' || github.event.inputs.listening_end || '10' }}
        run: node scripts/export-korean-audio.cjs "$START" "$END" "$LISTENING_START" "$LISTENING_END"
      - name: Synthesize neural Korean audio
        run: python scripts/generate-korean-audio.py --max-new 400
      - name: Commit audio and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tts/ko/ tts/manifest.js
          if git diff --cached --quiet; then
            echo "No new audio files"
          else
            git commit -m "Add Korean MeloTTS neural audio"
            git push
          fi

      - name: Request GitHub Pages rebuild for generated clips
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds" \
            || echo "GitHub Pages rebuild requires a later authorized deployment."

      - name: Continue remaining audio in next automatic batch
        if: ${{ success() && env.TOPIK_AUDIO_REMAINING != '0' && (github.event_name == 'push' || github.event.inputs.auto_expand == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Remaining audio clips: $TOPIK_AUDIO_REMAINING"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{"start":"1","end":"1500","listening_start":"0","listening_end":"230","auto_expand":"true"}}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/korean-neural-audio.yml/dispatches"
