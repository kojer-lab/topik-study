name: Korean Neural Audio (MeloTTS)

on:
  workflow_dispatch:
    inputs:
      start:
        description: First vocabulary number (1-1500)
        required: true
        default: '1'
      end:
        description: Last vocabulary number (1-1500)
        required: true
        default: '20'
  push:
    paths:
      - '.github/workflows/korean-neural-audio.yml'

permissions:
  contents: write

concurrency:
  group: korean-neural-audio
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Korean TTS
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/myshell-ai/MeloTTS.git"
          python -m unidic download
      - name: Export study texts
        env:
          START: ${{ github.event.inputs.start || '1' }}
          END: ${{ github.event.inputs.end || '20' }}
        run: node scripts/export-korean-audio.cjs "$START" "$END"
      - name: Synthesize neural Korean audio
        run: python scripts/generate-korean-audio.py
      - name: Commit audio and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tts/ko/ tts/manifest.js
          if git diff --cached --quiet; then
            echo "No new audio files"
          else
            git commit -m "Add Korean MeloTTS neural audio"
            git push
          fi
